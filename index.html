<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>願浮沉2:無火戰爭</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" integrity="sha384-NrKB+u6Ts6AtkIhwPixiKTzgSKNblyhlk0Sohlgar9UHUBzai/sgnNNWWd291xqt" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js" integrity="sha384-y49Zu59jZHJL/PLKgZPv3k2WI9c0Yp3pWB76V8OBVCb0QBKS8l4Ff3YslzHVX76Y" crossorigin="anonymous"></script>
<script src="https://accounts.google.com/gsi/client"></script>
</head>
<body>

<header class="top-bar" id="top-bar">
  <div id="google-signin-button" class="google-signin-btn"></div>
  <div class="account-slot" id="account-slot" hidden>
    <span class="account-slot__icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"/>
      </svg>
    </span>
    <span class="account-slot__label" id="account-label">帳號</span>
    <div class="account-dropdown" id="account-dropdown" hidden>
      <button type="button" class="account-dropdown__item" id="btn-sign-out">登出</button>
    </div>
  </div>
</header>

<main class="page1">
  <div class="panel">
    <h1 class="title">場次讀取</h1>

    <section class="field-group">
      <label class="field-label" for="date-picker">選擇日期時間</label>
      <div class="picker-row">
        <input type="date" id="date-picker" class="date-picker">
        <select id="hour-picker" class="time-select" aria-label="時"></select>
        <span class="dt-unit">時</span>
        <select id="minute-picker" class="time-select" aria-label="分"></select>
        <span class="dt-unit">分</span>
      </div>
    </section>

    <section class="field-group manual-datetime">
      <span class="field-label">日期時間</span>
      <div class="manual-datetime__row">
        <input type="number" id="field-year" class="dt-input dt-input--year" placeholder="YYYY" min="1970" max="9999" inputmode="numeric">
        <span class="dt-unit">年</span>
        <input type="number" id="field-month" class="dt-input dt-input--short" placeholder="MM" min="1" max="12" inputmode="numeric">
        <span class="dt-unit">月</span>
        <input type="number" id="field-day" class="dt-input dt-input--short" placeholder="DD" min="1" max="31" inputmode="numeric">
        <span class="dt-unit">日</span>
        <input type="number" id="field-hour" class="dt-input dt-input--short" placeholder="hh" min="0" max="23" inputmode="numeric">
        <span class="dt-unit">時</span>
        <input type="number" id="field-minute" class="dt-input dt-input--short" placeholder="mm" min="0" max="59" inputmode="numeric">
        <span class="dt-unit">分</span>
      </div>
    </section>

    <button id="btn-read-record" class="btn-primary" disabled>讀取記錄表</button>
  </div>
</main>

<main class="page2" id="page2" hidden>
  <div class="page-intro">
    <p class="page-intro__line">為期七日</p>
    <p class="page-intro__line">無火戰爭</p>
    <button id="btn-start-game" class="btn-primary page-intro__btn">正式開始！</button>
  </div>
</main>

<main class="page3" id="page3" hidden>
  <div class="chart-grid">
    <section class="chart-panel" data-slug="oniwara" style="grid-area: oniwara;">
      <div class="chart-panel__header">
        <span class="chart-panel__icon" aria-hidden="true"></span>
        <span class="chart-panel__org-name">-</span>
      </div>
      <div class="chart-panel__canvas-wrap"><canvas></canvas></div>
      <div class="chart-panel__numbers">
        <div class="chart-panel__number"><span class="chart-panel__number-label"></span><span class="chart-panel__number-value"></span></div>
        <div class="chart-panel__number"><span class="chart-panel__number-label"></span><span class="chart-panel__number-value"></span></div>
        <div class="chart-panel__number"><span class="chart-panel__number-label"></span><span class="chart-panel__number-value"></span></div>
      </div>
    </section>

    <section class="chart-panel" data-slug="mike" style="grid-area: mike;">
      <div class="chart-panel__header">
        <span class="chart-panel__icon" aria-hidden="true"></span>
        <span class="chart-panel__org-name">-</span>
      </div>
      <div class="chart-panel__canvas-wrap"><canvas></canvas></div>
      <div class="chart-panel__numbers">
        <div class="chart-panel__number"><span class="chart-panel__number-label"></span><span class="chart-panel__number-value"></span></div>
        <div class="chart-panel__number"><span class="chart-panel__number-label"></span><span class="chart-panel__number-value"></span></div>
        <div class="chart-panel__number"><span class="chart-panel__number-label"></span><span class="chart-panel__number-value"></span></div>
      </div>
    </section>

    <section class="common-data-panel" style="grid-area: common;">
      <div class="common-data-panel__row">
        <span class="common-data-panel__label">合法事業</span>
        <span class="common-data-panel__value" id="legal-business-value">-</span>
      </div>
      <div class="common-data-panel__row">
        <span class="common-data-panel__label">非法事業</span>
        <span class="common-data-panel__value" id="illegal-business-value">-</span>
      </div>
      <div class="common-data-panel__row" id="hot-business-row" hidden>
        <span class="common-data-panel__label">風頭事業</span>
        <span class="common-data-panel__value" id="hot-business-value">-</span>
      </div>
      <div class="warning-banner" id="warning-banner" hidden></div>
    </section>

    <section class="chart-panel" data-slug="kinugawa" style="grid-area: kinugawa;">
      <div class="chart-panel__header">
        <span class="chart-panel__icon" aria-hidden="true"></span>
        <span class="chart-panel__org-name">-</span>
      </div>
      <div class="chart-panel__canvas-wrap"><canvas></canvas></div>
      <div class="chart-panel__numbers">
        <div class="chart-panel__number"><span class="chart-panel__number-label"></span><span class="chart-panel__number-value"></span></div>
        <div class="chart-panel__number"><span class="chart-panel__number-label"></span><span class="chart-panel__number-value"></span></div>
        <div class="chart-panel__number"><span class="chart-panel__number-label"></span><span class="chart-panel__number-value"></span></div>
      </div>
    </section>

    <section class="chart-panel" data-slug="kouno" style="grid-area: kouno;">
      <div class="chart-panel__header">
        <span class="chart-panel__icon" aria-hidden="true"></span>
        <span class="chart-panel__org-name">-</span>
      </div>
      <div class="chart-panel__canvas-wrap"><canvas></canvas></div>
      <div class="chart-panel__numbers">
        <div class="chart-panel__number"><span class="chart-panel__number-label"></span><span class="chart-panel__number-value"></span></div>
        <div class="chart-panel__number"><span class="chart-panel__number-label"></span><span class="chart-panel__number-value"></span></div>
        <div class="chart-panel__number"><span class="chart-panel__number-label"></span><span class="chart-panel__number-value"></span></div>
      </div>
    </section>

    <section class="chart-panel" data-slug="ph003" style="grid-area: ph003;">
      <div class="chart-panel__header">
        <span class="chart-panel__icon" aria-hidden="true"></span>
        <span class="chart-panel__org-name">-</span>
      </div>
      <div class="chart-panel__canvas-wrap"><canvas></canvas></div>
      <div class="chart-panel__numbers">
        <div class="chart-panel__number"><span class="chart-panel__number-label"></span><span class="chart-panel__number-value"></span></div>
        <div class="chart-panel__number"><span class="chart-panel__number-label"></span><span class="chart-panel__number-value"></span></div>
        <div class="chart-panel__number"><span class="chart-panel__number-label"></span><span class="chart-panel__number-value"></span></div>
      </div>
    </section>
  </div>
</main>

<div class="loading-overlay" id="loading-overlay" hidden>
  <div class="loading-spinner" aria-hidden="true"></div>
</div>

<footer class="switch-zone" id="switch-zone" hidden>
  <span class="switch-zone__current-label" id="round-label-display"></span>
  <div class="switch-zone__wheel-wrap">
    <button class="switch-zone__wheel-arrow" id="scroller-prev" aria-label="上一個">&#8249;</button>
    <div class="switch-zone__wheel-window">
      <div class="switch-zone__wheel" id="scroller"></div>
      <div class="switch-zone__wheel-highlight" aria-hidden="true"></div>
    </div>
    <button class="switch-zone__wheel-arrow" id="scroller-next" aria-label="下一個">&#8250;</button>
  </div>
  <button class="switch-zone__read-btn" id="btn-round-read">讀取</button>
</footer>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<div id="dialog-overlay" class="dialog-overlay">
  <div class="dialog-box">
    <p id="dialog-message" class="dialog-message"></p>
    <div class="dialog-actions">
      <button id="dialog-yes" class="btn-secondary">是</button>
      <button id="dialog-no" class="btn-secondary">否</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
